<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Acciones</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #343a40;
        }

        .btn-custom {
            min-width: 90px;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        table th {
            background-color: #0d6efd;
            color: white;
        }

        table tr:hover {
            background-color: #f1f3f5;
        }

        .top-buttons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .top-buttons a {
            text-decoration: none;
        }
    </style>
</head>
<body>

<h1>Lista de Acciones</h1>

<div class="table-container">

    <div class="top-buttons">
        <a th:href="@{/acciones/crear}" class="btn btn-success btn-custom">+ Nueva Acción</a>
        <a th:href="@{/}" class="btn btn-secondary btn-custom">← Regresar al Inicio</a>
    </div>

    <table class="table table-striped table-hover text-center">
        <thead>
        <tr>
            <th>ID</th>
            <th>Acción</th>
            <th>Tabla</th>
            <th>Módulo</th>
            <th>Usuario</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${listaAcciones}">
            <td th:text="${a.codigoAccion}"></td>
            <td th:text="${a.accionAccion}"></td>
            <td th:text="${a.tablaAccion}"></td>
            <td th:text="${a.moduloAccion}"></td>
            <td th:text="${a.usuarioUsuAccion}"></td>
            <td>
                <a th:href="@{/acciones/editar/{id}(id=${a.codigoAccion})}"
                   class="btn btn-primary btn-sm btn-custom mb-1">Editar</a>

                <button class="btn btn-danger btn-sm btn-custom mb-1"
                        th:onclick="'confirmarEliminacion(' + ${a.codigoAccion} + ')'">
                    Eliminar
                </button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    function confirmarEliminacion(id) {
        Swal.fire({
            title: '¿Eliminar acción?',
            text: 'Esta acción puede estar relacionada con otros registros',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Sí, eliminar',
            cancelButtonText: 'Cancelar'
        }).then((result) => {
            if (result.isConfirmed) {
                window.location.href = '/acciones/eliminar/' + id;
            }
        });
    }
</script>

<!-- MENSAJE SI NO SE PUEDE ELIMINAR -->
<div th:if="${errorRelacion}">
    <script>
        Swal.fire({
            icon: 'error',
            title: 'No se puede eliminar',
            text: 'Esta acción está relacionada con otros registros'
        });
    </script>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
