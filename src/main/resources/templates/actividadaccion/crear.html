<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear / Editar Actividad Acción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .form-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: auto;
        }
        select, input { width: 100%; padding: 8px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc; }
        button { width: 100%; }
    </style>
</head>
<body>
<div class="form-container">
    <h2 th:text="${actividadAccion.codigoActividad == null} ? 'Crear Actividad Acción' : 'Editar Actividad Acción'"></h2>

    <form th:action="@{/actividad-accion/guardar}" th:object="${actividadAccion}" method="post">
        <!-- Número de actividad -->
        <div class="mb-3">
            <label class="form-label">Número de Actividad</label>
            <input type="number" th:field="*{numeroActividad}" class="form-control" placeholder="Ingrese número" required>
        </div>

        <!-- Fecha inicio -->
        <div class="mb-3">
            <label class="form-label">Fecha Inicio</label>
            <input type="date" th:field="*{fechaIniActividad}" class="form-control" required>
        </div>

        <!-- Fecha máxima -->
        <div class="mb-3">
            <label class="form-label">Fecha Máxima</label>
            <input type="date" th:field="*{fechaMaxActividad}" class="form-control" required>
        </div>

        <!-- Selección de acción -->
        <div class="mb-3">
            <label class="form-label">Acción</label>
            <select th:field="*{accion.codigoAccion}" class="form-select" required>
                <option value="" disabled th:selected="${actividadAccion.accion == null}">--Seleccione una acción--</option>
                <option th:each="ac : ${listaAcciones}" 
                        th:value="${ac.codigoAccion}" 
                        th:text="${ac.accionAccion}" 
                        th:selected="${actividadAccion.accion != null} ? ${ac.codigoAccion} == ${actividadAccion.accion.codigoAccion} : false">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary" 
                th:text="${actividadAccion.codigoActividad == null} ? 'Guardar' : 'Actualizar'">
        </button>
    </form>

    <a href="/actividad-accion" class="btn btn-secondary mt-3">Volver al listado</a>
</div>
</body>
</html>
