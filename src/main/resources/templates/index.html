<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Menú Principal</title>

<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(to right, #6a11cb, #2575fc);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .menu-container {
        background: white;
        padding: 40px 30px;
        border-radius: 15px;
        width: 380px;
        text-align: center;
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }

    h1 {
        font-size: 26px;
        margin-bottom: 30px;
        color: #333;
    }

    .menu-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 14px 0;
        margin: 12px 0;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        color: white;
        text-decoration: none;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .menu-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    .btn-accion { background-color: #007bff; }
    .btn-plan { background-color: #28a745; }
    .btn-actividad { background-color: #ffc107; color: #212529; }
</style>
</head>
<body>

<div class="menu-container">
    <h1>Menú Principal</h1>

    <a th:href="@{/acciones}" class="menu-btn btn-accion">
        Gestión de Acciones
    </a>

    <a th:href="@{/accion-plan-ambiental}" class="menu-btn btn-plan">
        Plan Ambiental :)
    </a>

    <a th:href="@{/actividad-accion}" class="menu-btn btn-actividad">
        Actividades de Acción
    </a>
</div>

</body>
</html>
